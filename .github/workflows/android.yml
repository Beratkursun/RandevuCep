name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/android.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK / NDK
        run: |
          SDKM="$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)")"
          export PATH="$SDKM:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Bağımlılıklar
        run: bun install --frozen-lockfile

      - name: Android projesini üret
        run: bunx tauri android init --ci

      - name: APK derle
        run: bunx tauri android build --apk

      - name: APK imzala (debug anahtar)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 > /dev/null 2>&1
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out RandevuCep.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs RandevuCep.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: randevucep-apk
          path: RandevuCep.apk
          if-no-files-found: error
